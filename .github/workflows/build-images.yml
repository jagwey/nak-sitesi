name: Build Production Docker Images

on:
  workflow_dispatch:
    inputs:
      s3_public_base_url:
        description: "Public media base URL baked into Next.js CSP/images config"
        required: false
        default: "https://nakis-vitrin.nakis-sitesi.workers.dev/images"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "prisma/**"
      - "src/**"
      - "public/**"
      - "tools/embroidery/parse.py"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: tools
          push: true
          tags: |
            ghcr.io/jagwey/nak-sitesi-tools:latest
            ghcr.io/jagwey/nak-sitesi-tools:${{ github.sha }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

      - name: Build and push web image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: app
          push: true
          build-args: |
            S3_PUBLIC_BASE_URL=${{ inputs.s3_public_base_url || 'https://nakis-vitrin.nakis-sitesi.workers.dev/images' }}
          tags: |
            ghcr.io/jagwey/nak-sitesi-web:latest
            ghcr.io/jagwey/nak-sitesi-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
