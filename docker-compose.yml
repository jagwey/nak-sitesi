# Local development stack. Primary workflow: `npm run db:up` + `npm run dev` on the host.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nakis
      POSTGRES_PASSWORD: nakis_dev_password
      POSTGRES_DB: nakis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakis -d nakis"]
      interval: 5s
      timeout: 3s
      retries: 20

  # NOTE: the official minio/minio Docker Hub + quay.io images are no longer pullable
  # (MinIO stopped publishing community images). Chainguard's rebuild is used instead.
  # These images are distroless (no shell), so bucket creation is split into tiny one-shot mc services.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nakis_minio
      MINIO_ROOT_PASSWORD: nakis_minio_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mc-private:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on: [minio]
    restart: on-failure
    environment:
      MC_HOST_local: http://nakis_minio:nakis_minio_dev_secret@minio:9000
    command: ["mb", "--ignore-existing", "local/nakis-private"]

  mc-public:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      mc-private:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      MC_HOST_local: http://nakis_minio:nakis_minio_dev_secret@minio:9000
    command: ["mb", "--ignore-existing", "local/nakis-public"]

  mc-policy:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      mc-public:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      MC_HOST_local: http://nakis_minio:nakis_minio_dev_secret@minio:9000
    command: ["anonymous", "set", "download", "local/nakis-public"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional: run the app in a container instead of `npm run dev` on the host.
  # app:
  #   build: .
  #   env_file: .env
  #   ports: ["3000:3000"]
  #   depends_on: [postgres, minio, mailpit]

volumes:
  pgdata:
  miniodata:
