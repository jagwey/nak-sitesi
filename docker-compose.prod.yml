name: nakis-production

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakis
      POSTGRES_USER: nakis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nakis", "-d", "nakis"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: app
      args:
        S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL gerekli}
    restart: unless-stopped
    env_file: .env.production
    # Shopier değişkenleri (SHOPIER_OSB_USERNAME, SHOPIER_OSB_KEY, SHOPIER_PAT,
    # SHOPIER_WEBHOOK_SECRET, SHOPIER_STORE_URL, SHOPIER_API_BASE_URL) .env.production üzerinden env_file
    # ile geçer. Boş ${VAR:-} burada yazılmaz; env_file değerinin üstüne biner.
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NAKIS_WEB_PORT:-3100}:3000"

  tools:
    profiles: ["ops"]
    build:
      context: .
      target: tools
    env_file: .env.production
    # shopier:sync bu konteynerde SHOPIER_PAT değerini env_file üzerinden alır.
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
